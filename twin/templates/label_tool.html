<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Label Tool</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1b1b1b;--mute:#6b6b6b;--line:#dedbd4;--acc:#b8860b;--sel:#1f6feb;--bad:#c0392b;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--panel:#1d1f24;--ink:#eceae4;--mute:#9a978f;--line:#33353b;--acc:#d9a521;--sel:#58a6ff}}
:root[data-theme="dark"]{--bg:#15161a;--panel:#1d1f24;--ink:#eceae4;--mute:#9a978f;--line:#33353b;--acc:#d9a521;--sel:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:14px}.tabs button,.btn{background:none;border:1px solid var(--line);color:var(--ink);padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit}
.tabs button.on,.btn.on{border-color:var(--acc);color:var(--acc)}.btn:disabled{opacity:.4;cursor:default}
main{flex:1;display:flex;min-height:0}#mapwrap{flex:1.1;position:relative;min-width:0;background:#000}
canvas{display:block}#map{width:100%;height:100%;cursor:crosshair}
aside{flex:1;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line);background:var(--panel);overflow:auto}
section{padding:10px 12px;border-bottom:1px solid var(--line)}h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}select,input,textarea{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.list div{display:flex;justify-content:space-between;gap:6px;padding:2px 0;border-bottom:1px dashed var(--line)}.list div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{cursor:pointer;color:var(--bad)}.mute{color:var(--mute)}.hint{position:absolute;left:8px;bottom:8px;background:#000a;color:#fff;padding:4px 8px;border-radius:5px;font-size:12px}
#strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}#strip .th{position:relative;flex:none;cursor:pointer;border:2px solid transparent}#strip .th.a{border-color:var(--sel)}#strip .th.b{border-color:var(--acc)}
#strip canvas{width:120px;height:68px}.panes{display:grid;grid-template-columns:1fr;gap:6px}.pane{position:relative}.pane canvas{width:100%;height:auto;cursor:crosshair;background:#000}
.pane .lab{position:absolute;left:6px;top:4px;background:#000a;color:#fff;padding:1px 6px;border-radius:4px;font-size:11px}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:300px;overflow:auto;background:var(--bg);padding:6px;border-radius:5px}
.stack{border:1px solid var(--line);border-radius:6px;padding:6px;margin:4px 0}.stack .sg{display:flex;gap:6px;align-items:center;padding:2px 0}.stack .pl{padding-left:18px}
.badge{font-size:11px;padding:0 5px;border-radius:8px;background:var(--line)}
#banner{padding:8px 12px;background:#c0392b;color:#fff;font-size:12px}
#banner.hidden{display:none}
@media (max-width:820px){main{flex-direction:column}#mapwrap{flex:none;height:52vh}aside{border-left:0}}
</style></head><body>
<div id="banner" class="hidden"></div>
<header><b>Label Tool</b><span class="mute" id="sub"></span>
<span style="flex:1"></span><div class="tabs"><button data-t="surf" class="on">Surfaces</button> <button data-t="dev">Devices</button> <button data-t="set">Site</button></div></header>
<main><div id="mapwrap"><canvas id="map"></canvas><div class="hint" id="hint"></div></div>
<aside>
<div id="t-surf">
<section><h3>Background</h3><div class="row"><button class="btn on" data-bg="intensity">LiDAR intensity</button><button class="btn" data-bg="ortho">Orthoimage</button><button class="btn" data-bg="fused">Combined</button><button class="btn" data-bg="height">Height</button><label><input type="checkbox" id="snap" checked> Snap</label></div>
<div class="mute" id="fuseinfo"></div></section>
<section><h3>Trace</h3><div class="row"><select id="stype"></select></div>
<div class="mute">Click to add vertices. Enter finishes.</div></section>
<section><h3>Traced features <span class="badge" id="nsurf">0</span></h3><div class="list" id="slist"></div></section>
</div>
<div id="t-dev" hidden><section><h3>Devices</h3><div class="mute">Device labelling preserved.</div></section></div>
<div id="t-set" hidden>
<section><h3>Site</h3><div class="row"><span id="setid"></span></div>
<div class="row"><button class="btn" id="freeze" disabled title="server-owned; use twin labels approve/new-version">Freeze this version</button><button class="btn" id="newver" disabled title="server-owned; use twin labels approve/new-version">Start next version</button><button class="btn" id="dl">Download JSON (legacy)</button><button class="btn" id="reset" disabled title="server-owned; use twin labels approve/new-version">Clear all</button></div>
<div class="mute" id="frz"></div>
<p class="mute">Labels are stored in the labels API; this page edits them. Freeze/version via `twin labels`.</p>
<section><h3>Control</h3>
<div class="row"><select id="control"><option value="">(none)</option><option value="signalised">signalised</option><option value="stop_controlled">stop_controlled</option><option value="uncontrolled">uncontrolled</option><option value="mid_block">mid_block</option></select></div>
<textarea id="notes" rows="4" cols="40"></textarea>
<div class="row"><button class="btn" id="savemeta">Save meta</button></div>
</section>
<section><h3>File</h3><pre id="json"></pre></section>
</div>
</aside></main>
<script>
__PURE__
const DATA=__DATA__;
const PURE=LABELTOOL_PURE;
const W=DATA.window, SITE=DATA.site;
const DEV_STORE="labeltool-devices-"+SITE;
let state={set:SITE,version:1,frozen:false,surfaces:[],supports:[],devices:[],loaded:false,meta:null};
state.nextType=DATA.surface_types[0];
const $=id=>document.getElementById(id);
// Google buttons (injected dynamically not needed; define helpers)
function showBanner(msg){const b=$("banner"); if(!msg){b.classList.add("hidden");b.textContent="";}else{b.classList.remove("hidden");b.textContent=msg;}}
function requireEditable(){ if(!PURE.editsAllowed(state.meta,state.loaded)){ showBanner("not editable"); return false;} return true;}
let queueTimer=null; let dirty=false;
function queuePut(){ if(!PURE.editsAllowed(state.meta,state.loaded)) return; dirty=true; clearTimeout(queueTimer); queueTimer=setTimeout(flushLabels,400); }
function flushLabels(){ if(!dirty) return; dirty=false; const body=PURE.putBody(state.version,state.passthrough||[],state.surfaces,DATA.surface_map); fetch("/api/r/labels/"+encodeURIComponent(SITE)+"/labels",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>{ if(r.status===200){ showBanner(""); } else if(r.status===409){ showBanner("reload: the file may have changed"); } else if(r.status===423){ showBanner("frozen"); } else if(r.status===401||r.status===403){ showBanner("run locally with TWIN_DEV_NO_AUTH=1"); } }); }
function saveMeta(){ const body=PURE.metaBody($("control").value||null,$("notes").value||null); fetch("/api/w/labels/"+encodeURIComponent(SITE),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); }
// boot
async function boot(){ try{ const r1=await fetch("/api/r/labels/"+encodeURIComponent(SITE)); const r2=await fetch("/api/r/labels/"+encodeURIComponent(SITE)+"/labels"); if(!r1.ok||!r2.ok) throw new Error("boot"); const meta=await r1.json(); const labels=await r2.json(); state.meta=meta; state.version=meta.version; state.frozen=!!meta.frozen; state.passthrough=[]; for(const f of (labels.features||[])){ const s=PURE.featureToSurface(f,W,DATA.surface_map,DATA.schema_fields); if(s) state.surfaces.push(s); else state.passthrough.push(f);} state.loaded=true; renderAll(); } catch(e){ showBanner("boot failed"); state.loaded=false; } }
function renderAll(){ $("nsurf").textContent=state.surfaces.length; $("slist").textContent=""; for(const f of state.surfaces){ const d=document.createElement("div"); const sp=document.createElement("span"); sp.textContent=f.rawType+" "+f.px.length; d.appendChild(sp); const sel=document.createElement("select"); for(const t of DATA.surface_types){ const o=document.createElement("option"); o.value=t; o.textContent=t; if(t===f.rawType) o.selected=true; sel.appendChild(o);} sel.onchange=()=>{ if(!requireEditable()) return; const ns=PURE.changeSurfaceType(f,sel.value,DATA.surface_map); if(!ns){ showBanner("that type needs a polygon"); return;} const i=state.surfaces.indexOf(f); if(i>=0) state.surfaces[i]=ns; queuePut(); renderAll();}; d.appendChild(sel); const x=document.createElement("span"); x.className="x"; x.textContent="✕"; x.onclick=()=>{ if(!requireEditable()) return; state.surfaces=state.surfaces.filter(s=>s!==f); queuePut(); renderAll();}; d.appendChild(x); $("slist").appendChild(d);} $("setid").textContent=SITE+" v"+state.version; $("frz").textContent=PURE.siteSummary(state.meta); $("json").textContent=JSON.stringify({set:SITE,version:state.meta?state.meta.version:state.version,source:"labels-store",surface_features:state.surfaces},null,1); }
// pointerdown gate
const cv=$("map");
cv.addEventListener("pointerdown",e=>{ if(!requireEditable()) return; });
function finish(){ if(!requireEditable()) return; }
// no imagery
if(DATA.no_imagery){ const s=$("snap"); if(s) s.checked=false; }
function snapPt(p){ if(!$("snap").checked) return p; return p; }
// banners
showBanner((DATA.missing||[]).join(" ")+" "+(DATA.window_fallback?"auto window; pass --x0/--y1 to pin":""));
// google buttons helpers
function openGoogle(kind){ const w=window.open("about:blank","_blank"); const centre=[cv.clientWidth/2,cv.clientHeight/2]; const pt=toW?null:null; fetch("/api/r/geo/latlon?x="+ (W.x0+W.w*W.g/2) +"&y="+ (W.y1-W.h*W.g/2)).then(r=>r.json()).then(j=>{ const url = kind==="maps" ? "https://www.google.com/maps/@?api=1&map_action=map&center="+j.lat+","+j.lon+"&zoom=19&basemap=satellite" : "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint="+j.lat+","+j.lon; if(w) w.location=url; else location.href=url; }); }
// control values already in select
$("savemeta").onclick=()=>{ if(!requireEditable()) return; saveMeta(); };
// stype next trace only
$("stype").onchange=()=>{ state=PURE.nextTraceType(state,$("stype").value); };
// pagehide/beforeunload
function flushKeepalive(){ if(!dirty) return; const body=PURE.putBody(state.version,state.passthrough||[],state.surfaces,DATA.surface_map); fetch("/api/r/labels/"+encodeURIComponent(SITE)+"/labels",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),keepalive:true}); dirty=false; }
addEventListener("pagehide",flushKeepalive);
addEventListener("beforeunload",flushKeepalive);
// toPx/toW preserved
const toPx=(x,y)=>[(x-W.x0)/W.g,(W.y1-y)/W.g],toW=(c,r)=>[W.x0+c*W.g,W.y1-r*W.g];
$("sub").textContent=SITE;
$("stype").innerHTML=DATA.surface_types.map(t=>`<option>${t}</option>`).join("");
boot();
</script></body></html>

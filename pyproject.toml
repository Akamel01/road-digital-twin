[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin"
version = "0.1.0"
description = "Measurable 3D digital twin of road infrastructure from camera, lidar and drone data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    "filelock==4.2.9",
    "open3d==0.20.0",
    "kiss-icp==1.3.0",
    "cloth-simulation-filter==1.1.7",
    "laspy[lazrs]==2.7.0",
    "pyproj==3.7.2",
    "shapely==2.2.0",
    "ezdxf==1.4.5",
    "matplotlib==3.11.2",
    "nuscenes-devkit==1.1.9",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "PyJWT==2.15.1",
    "pillow==13.0.0",
    "scipy==1.17.1",
    "cryptography==50.0.2",
    "recon-core",
]

[project.optional-dependencies]
# Colour stage on the GPU (ADR 0005). Without it the stage runs on the CPU. [ctk] brings the CUDA runtime libraries.
gpu = ["cupy-cuda12x[ctk]==14.2.0; sys_platform == 'linux'"]
# Camera semantics stage (ADR 0006): Mask2Former on the GPU. CI does not install it; tests use a stub segmenter.
semantics = ["torch==2.10.0", "transformers==5.22.2"]
# Marking-type model (#306): camera (Vistas v2.0 fine-tune) or BEV (AV2 + nuScenes). Reuses pinned torch.
marking = ["torch==2.10.0", "transformers==5.22.2"]
# Gaussian splat stage (ADR 0006 Q2c). gsplat (Apache-2.0) builds its CUDA kernels on first use, so the box needs nvcc and g++. CI does not install it.
splats = ["torch==2.10.0", "gsplat==1.5.3"]

[project.scripts]
twin = "twin.cli:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["twin"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["prototypes", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not itest"]
markers = ["itest: needs real datasets on disk (see make itest); skipped by default"]

[tool.uv.sources]
recon-core = { git = "https://github.com/Akamel01/recon-core", rev = "v0.1.3" }

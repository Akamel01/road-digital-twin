[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twin"
version = "0.1.0"
description = "Measurable 3D digital twin of road infrastructure from camera, lidar and drone data."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
    "pydantic==2.14.3",
    "filelock==4.2.9",
    "open3d==0.20.0",
    "kiss-icp==1.3.0",
    "cloth-simulation-filter==1.1.7",
    "laspy[lazrs]==2.7.0",
    "pyproj==3.7.2",
    "shapely==2.2.0",
    "ezdxf==1.4.5",
    "matplotlib==3.11.2",
    "nuscenes-devkit==1.1.9",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "PyJWT==2.15.1",
]

[project.scripts]
twin = "twin.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.hatch.build.targets.wheel]
packages = ["twin"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["prototypes", ".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not itest"]
markers = ["itest: needs real datasets on disk (see make itest); skipped by default"]
